name: Core Full CI

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 2 * * 0'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pull-requests: read
  security-events: write

concurrency:
  group: core-full-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/core-checks.yml
    with:
      full: true
