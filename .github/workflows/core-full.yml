name: Core Full CI

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      release_tag:
        description: Private candidate tag supplied only by the release orchestrator
        type: string
        default: ''

permissions:
  contents: read
  actions: read
  pull-requests: read
  security-events: write

concurrency:
  group: core-full-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/core-checks.yml
    with:
      full: true
      release_tag: ${{ inputs.release_tag || '' }}
