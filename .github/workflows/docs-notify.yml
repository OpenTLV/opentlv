name: Notify documentation portal

on:
  workflow_run:
    workflows: [Core Main CI]
    types: [completed]

permissions:
  contents: read

jobs:
  notify:
    if: >-
      github.repository == 'OpenTLV/opentlv' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      # No checkout or component code executes with the cross-repository token.
      - name: Notify the portal of the tested Core revision
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.OPENTLV_DOCS_DISPATCH_TOKEN }}
          script: |
            const run = context.payload.workflow_run;
            if (run.head_branch !== 'main') {
              core.info('Only successful Core Main CI updates development documentation.');
              return;
            }
            await github.rest.repos.createDispatchEvent({
              owner: 'OpenTLV', repo: 'opentlv-docs', event_type: 'core-docs-updated',
              client_payload: {source: 'core', repository: context.repo.owner + '/' + context.repo.repo,
                commit: run.head_sha, ref: run.head_branch, run_id: run.id}
            });
