name: Public CMake consumers

on:
  workflow_call:
    inputs:
      release_tag:
        description: Private candidate tag supplied only by the release orchestrator
        type: string
        default: ''
      full:
        type: boolean
        default: true
  workflow_dispatch:
    inputs:
      full:
        description: Run the complete configuration matrix
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  amalgamation:
    strategy:
      fail-fast: false
      matrix:
        toolchain: ${{ fromJSON(inputs.full && '[{"os":"ubuntu-24.04","cc":"gcc","cxx":"g++"},{"os":"ubuntu-24.04","cc":"clang-18","cxx":"clang++-18"},{"os":"windows-2022","cc":"cl","cxx":"cl"}]' || '[{"os":"ubuntu-24.04","cc":"clang-18","cxx":"clang++-18"}]') }}
        shared: ['ON', 'OFF']
    runs-on: ${{ matrix.toolchain.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Apply proposed release version locally
        if: inputs.release_tag != ''
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: python -B scripts/core_release.py prepare
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - name: Install Clang
        if: matrix.toolchain.cc == 'clang-18'
        run: sudo apt-get update && sudo apt-get install -y clang-18 ninja-build
      - name: Install and compare standalone C99 and C++17 consumers
        run: >-
          python scripts/check_amalgamation_consumers.py
          --shared ${{ matrix.shared }}
          --cc ${{ matrix.toolchain.cc }} --cxx ${{ matrix.toolchain.cxx }}
      - name: Check minimum CMake, custom install layout and disabled Query features
        if: matrix.toolchain.cc == 'clang-18' && matrix.shared == 'OFF'
        shell: bash
        run: |
          python -m pip install --target build/cmake-3.16 cmake==3.16.8
          export PATH="$PWD/build/cmake-3.16/cmake/data/bin:$PATH"
          python scripts/test_module_isolation.py IsolationTests.test_cross_directory_private_static_export
          python scripts/check_amalgamation_consumers.py --cc clang-18 --cxx clang++-18 \
            --shared OFF --query-frontend OFF --query-set-operations OFF --data-dir 'custom data'

  consumers:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.full && '["ubuntu-latest", "windows-2022"]' || '["ubuntu-latest"]') }}
        shared: ${{ fromJSON(inputs.full && '["ON", "OFF"]' || '["ON"]') }}
        cxx: ${{ fromJSON(inputs.full && '["ON", "OFF"]' || '["ON"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Apply proposed release version locally
        if: inputs.release_tag != ''
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: python -B scripts/core_release.py prepare

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install minimum CMake for standalone examples
        if: runner.os == 'Linux'
        run: python -m pip install --target build/cmake-3.16 cmake==3.16.8
      - name: Build and run external consumers
        run: >-
          python scripts/check_cmake_integration.py
          --shared ${{ matrix.shared }} --cxx ${{ matrix.cxx }}
          --examples-cmake ${{ runner.os == 'Linux' && 'build/cmake-3.16/cmake/data/bin/cmake' || 'cmake' }}
      - name: Check installed examples without the Query frontend
        if: inputs.full && runner.os == 'Linux' && matrix.cxx == 'ON' && matrix.shared == 'ON'
        run: >-
          python scripts/check_cmake_integration.py --shared ON --cxx ON --query-frontend OFF
          --examples-cmake build/cmake-3.16/cmake/data/bin/cmake
      - name: Check all consumer modes with minimum CMake
        if: runner.os == 'Linux' && matrix.cxx == 'ON' && matrix.shared == 'ON'
        shell: bash
        run: |
          export PATH="$PWD/build/cmake-3.16/cmake/data/bin:$PATH"
          python scripts/check_cmake_integration.py --shared ON --cxx ON --build-root build/consumers-cmake-3.16
      - name: Verify modular CMake infrastructure and isolation
        if: runner.os == 'Linux' && matrix.cxx == 'ON' && matrix.shared == 'ON'
        run: |
          python -B scripts/test_module_isolation.py
          python -B scripts/test_module_isolation.py --integration
          python -B scripts/check_module_isolation.py --shared ON
          python -B scripts/check_module_isolation.py --shared OFF
      - name: Compare modular behavior with the immutable reference
        if: runner.os == 'Linux' && matrix.cxx == 'ON' && matrix.shared == 'ON'
        run: >-
          python -B scripts/verify_modular_baseline.py
          --build build/modular-baseline --output build/modular-evidence
      - name: Preserve modular verification evidence
        if: always() && runner.os == 'Linux' && matrix.cxx == 'ON' && matrix.shared == 'ON'
        uses: actions/upload-artifact@v4
        with:
          name: modular-verification-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            build/modular-evidence/
            build/module-isolation/**/report.json
          if-no-files-found: error
      - name: Record informational modular performance comparison
        if: inputs.full && runner.os == 'Linux' && matrix.cxx == 'ON' && matrix.shared == 'ON'
        run: python -B scripts/modular_performance.py --output build/modular-performance
      - name: Preserve informational performance evidence
        if: always() && inputs.full && runner.os == 'Linux' && matrix.cxx == 'ON' && matrix.shared == 'ON'
        uses: actions/upload-artifact@v4
        with:
          name: modular-performance-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            build/modular-performance/performance.json
            build/modular-performance/candidate-files.json
            build/modular-performance/baseline/*.log
            build/modular-performance/candidate/*.log
          if-no-files-found: error
