name: Public CMake consumers

on:
  workflow_call:
    inputs:
      release_tag:
        description: Private candidate tag supplied only by the release orchestrator
        type: string
        default: ''
      full:
        type: boolean
        default: true
  workflow_dispatch:
    inputs:
      full:
        description: Run the complete configuration matrix
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  consumers:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.full && '["ubuntu-latest", "windows-2022"]' || '["ubuntu-latest"]') }}
        shared: ${{ fromJSON(inputs.full && '["ON", "OFF"]' || '["ON"]') }}
        cxx: ${{ fromJSON(inputs.full && '["ON", "OFF"]' || '["ON"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Apply proposed release version locally
        if: inputs.release_tag != ''
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: python -B scripts/core_release.py prepare

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build and run external consumers
        run: >-
          python scripts/check_cmake_integration.py
          --shared ${{ matrix.shared }} --cxx ${{ matrix.cxx }}
      - name: Verify modular CMake infrastructure and isolation
        if: runner.os == 'Linux' && matrix.cxx == 'ON' && matrix.shared == 'ON'
        run: |
          python -B scripts/test_module_isolation.py
          python -B scripts/test_module_isolation.py --integration
          python -B scripts/check_module_isolation.py --shared ON
          python -B scripts/check_module_isolation.py --shared OFF
