name: Core Pull Request CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  actions: read
  pull-requests: read
  security-events: write

concurrency:
  group: core-pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    uses: ./.github/workflows/core-checks.yml
    with:
      full: false
