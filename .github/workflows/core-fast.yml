name: Core Fast CI

on:
  pull_request:
    branches: [main]
  push:
    branches: ['**', '!main']

permissions:
  contents: read
  actions: read
  pull-requests: read
  security-events: write

concurrency:
  group: core-fast-${{ github.ref }}
  cancel-in-progress: true

jobs:
  eligibility:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      run: ${{ steps.select.outputs.run }}
    steps:
      - uses: actions/github-script@v7
        id: select
        with:
          script: |
            if (context.eventName === 'pull_request') {
              core.setOutput('run', 'true');
              return;
            }
            const branch = context.ref.replace(/^refs\/heads\//, '');
            const { data: pulls } = await github.rest.pulls.list({
              ...context.repo, state: 'open', head: `${context.repo.owner}:${branch}`,
              base: 'main', per_page: 1
            });
            core.setOutput('run', pulls.length === 0 ? 'true' : 'false');
  checks:
    needs: eligibility
    if: needs.eligibility.outputs.run == 'true'
    uses: ./.github/workflows/core-checks.yml
    with:
      full: false
