name: Lua Bindings

# Builds and tests the experimental Lua bindings (bindings/lua): a native
# extension module built directly against the Lua C API, exercised across
# the versions it targets (5.1 through 5.4; LuaJIT implements the 5.1 API).
# leafo/gh-actions-lua builds the interpreter and this module against the
# same shared Lua library; linking against a different, separately linked
# Lua would give the process two independent copies of the Lua runtime
# sharing one lua_State, which crashes (see bindings/lua/README.md's Build
# section).
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['[0-9]*.[0-9]*.[0-9]*']
  pull_request:
    branches: [main]
    paths:
      - 'bindings/lua/**'
      - 'bindings/common/**'
      - 'tests/query/**'
      - 'tlv/**'
      - 'cmake/**'
      - '**/CMakeLists.txt'
      - '.github/workflows/lua.yml'

concurrency:
  group: lua-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    permissions:
      contents: read
    name: build and test / ${{ matrix.os }} / lua ${{ matrix.lua_version }}
    strategy:
      fail-fast: false
      matrix:
        # Exercise Windows setup on PRs too; manual and release runs include macOS.
        os: ${{ fromJSON((startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch') && '["ubuntu-24.04", "windows-latest", "macos-latest"]' || '["ubuntu-24.04", "windows-latest"]') }}
        lua_version: ['5.1', '5.3', '5.4']
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      # gh-actions-lua builds Lua with cl on Windows, which needs the MSVC
      # environment.
      - name: Initialize MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Set up Lua
        uses: leafo/gh-actions-lua@v10
        with:
          luaVersion: ${{ matrix.lua_version }}

      - name: Set up LuaRocks
        uses: leafo/gh-actions-luarocks@v4

      - name: Install test dependencies
        shell: bash
        run: |
          # Dependency rockspecs can fetch archives outside the LuaRocks server.
          # Retry transient download failures while retaining a failing final status.
          for attempt in 1 2 3; do
            if luarocks install busted; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "::warning::Test dependency installation failed (attempt $attempt/3); retrying in 5 seconds."
              sleep 5
            fi
          done
          echo "::error::Test dependency installation failed after 3 attempts."
          exit 1

      - name: Build and install the opentlv rock
        working-directory: bindings/lua
        run: luarocks make

      - name: Test
        working-directory: bindings/lua
        run: busted tests

      - name: Run examples
        working-directory: bindings/lua
        shell: bash
        run: |
          set -e
          for example in examples/*.lua; do
            echo "::group::$example"
            lua "$example"
            echo "::endgroup::"
          done

      - name: Common compiled Query corpus through Lua facade
        run: |
          python3 tests/query/lua_facade.py --output build/lua-query-conformance.lua
          lua build/lua-query-conformance.lua
