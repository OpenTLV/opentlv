name: Fixed TLV

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '43 6 * * 1'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  fixed-tlv:
    name: fixed-tlv
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CC: gcc
      CXX: g++
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Compile public headers
        run: python3 tests/check_public_api.py
      - name: Compile public headers with Clang
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
        env:
          CC: clang-18
          CXX: clang++-18
        run: python3 tests/check_public_api.py
      - name: Test the fixed model, reader and writer
        run: python3 tests/check_fixed_model.py
      - name: Test the release build
        run: python3 tests/check_fixed_model.py --release
      - name: Build and run CTest in Debug and Release
        id: ctest
        run: |
          build="$RUNNER_TEMP/opentlv-tests"
          cmake -S . -B "$build" -G "Ninja Multi-Config" -DBUILD_TESTING=ON
          for config in Debug Release; do
            cmake --build "$build" --config "$config"
            python3 tests/run_ctest.py "$build" "$config" "$RUNNER_TEMP/ctest-reports/$config"
          done
      - name: Run AddressSanitizer and UndefinedBehaviorSanitizer
        env:
          CC: clang-18
          CXX: clang++-18
          CFLAGS: -fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer
          LDFLAGS: -fsanitize=address,undefined
          ASAN_OPTIONS: halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          python3 tests/check_fixed_model.py --sanitize
          export CXXFLAGS="$CFLAGS"
          build="$RUNNER_TEMP/opentlv-sanitized"
          cmake -S . -B "$build" -G Ninja -DBUILD_TESTING=ON -DCMAKE_BUILD_TYPE=Debug
          cmake --build "$build"
          python3 tests/run_ctest.py "$build" Debug "$RUNNER_TEMP/ctest-reports/sanitizers"
      - name: Publish CTest JUnit reports and logs
        if: ${{ !cancelled() && steps.ctest.outcome != 'skipped' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ctest-reports
          path: ${{ runner.temp }}/ctest-reports/
          if-no-files-found: error
      - name: Check and report reproducible library coverage
        id: coverage
        env:
          CC: gcc-13
          CXX: g++-13
          GCOV: gcov-13
        run: |
          test "$(gcc-13 -dumpfullversion)" = 13.3.0
          python3 -m unittest discover -s tests -p test_check_coverage.py
          python3 tests/check_fixed_model.py --coverage "$RUNNER_TEMP/coverage.txt"
          python3 tests/check_fixed_model.py --coverage "$RUNNER_TEMP/coverage-repeat.txt"
          diff -u "$RUNNER_TEMP/coverage.txt" "$RUNNER_TEMP/coverage-repeat.txt"
          {
            echo '### Fixed TLV coverage'
            echo
            echo '```text'
            cat "$RUNNER_TEMP/coverage.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Publish production coverage reports
        if: ${{ !cancelled() && steps.coverage.outcome != 'skipped' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-reports
          path: |
            ${{ runner.temp }}/coverage.txt
            ${{ runner.temp }}/coverage-repeat.txt
          if-no-files-found: error
      - name: Test the installed static CMake package
        run: python3 tests/check_cmake_package.py
      - name: Test the installed shared CMake package
        run: python3 tests/check_cmake_package.py --shared

  windows-x86:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Configure MSVC and GoogleTest for Win32
        run: >-
          cmake -S . -B build-x86 -G "Visual Studio 17 2022" -A Win32 -T "v143,version=14.44.35207"
          -DBUILD_TESTING=ON -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded
      - name: Build x86 tests
        run: cmake --build build-x86 --config Release --parallel
      - name: Run x86 suites and verify native-size cases
        id: x86
        run: python tests/run_ctest.py build-x86 Release "$env:RUNNER_TEMP/ctest-reports-x86" --require-x86
      - name: Publish x86 CTest results
        if: ${{ !cancelled() && steps.x86.outcome != 'skipped' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ctest-reports-x86
          path: ${{ runner.temp }}/ctest-reports-x86/
          if-no-files-found: error

  windows-package:
    name: windows-package
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: windows-2022
    timeout-minutes: 15
    env:
      CMAKE_GENERATOR: Visual Studio 17 2022
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Test the installed static CMake package with MSVC
        run: python tests/check_cmake_package.py
      - name: Test the installed shared CMake package with MSVC
        run: python tests/check_cmake_package.py --shared

  workflow-analyzers:
    name: workflow-analyzers
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Check workflow syntax and expressions
        shell: bash
        run: |
          curl --fail --silent --show-error --location \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            --output "$RUNNER_TEMP/actionlint.tar.gz"
          printf '%s  %s\n' 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8 \
            "$RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -shellcheck= -pyflakes=
      - name: Install zizmor
        run: |
          python3 -m venv "$RUNNER_TEMP/zizmor-venv"
          "$RUNNER_TEMP/zizmor-venv/bin/python" -m pip install --require-hashes --only-binary=:all: -r .github/requirements-actions.txt
      - name: Audit workflow security offline
        if: github.ref != 'refs/heads/main' || (github.event_name != 'push' && github.event_name != 'schedule')
        run: |
          "$RUNNER_TEMP/zizmor-venv/bin/zizmor" --offline --strict-collection --collect=workflows .
      - name: Audit workflow security online
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'schedule')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          : "${GH_TOKEN:?GitHub token is required for online audits}"
          "$RUNNER_TEMP/zizmor-venv/bin/zizmor" --strict-collection --collect=workflows .
