name: Fixed TLV

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '43 6 * * 1'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  fixed-tlv:
    name: fixed-tlv
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CC: gcc
      CXX: g++
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Compile public headers
        run: python3 tests/check_public_api.py
      - name: Compile public headers with Clang
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
        env:
          CC: clang-18
          CXX: clang++-18
        run: python3 tests/check_public_api.py
      - name: Build and run GCC x64 contracts in Debug and Release
        id: ctest
        run: python3 -B tests/run_quality.py contracts --work-dir "$RUNNER_TEMP"
      - name: Compare repeated GCC x64 Release contracts
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
        run: |
          reports="$RUNNER_TEMP/ctest-reports"
          python3 -B tests/run_ctest.py "$RUNNER_TEMP/opentlv-tests" Release "$reports/Release-repeat" --require-x64
          cmp "$reports/Release/passed-cases.txt" "$reports/Release-repeat/passed-cases.txt"
      - name: Build and run Clang x64 Release contracts
        env:
          CC: clang-18
          CXX: clang++-18
        run: |
          build="$RUNNER_TEMP/opentlv-clang-release"
          cmake -S . -B "$build" -G Ninja -DBUILD_TESTING=ON -DCMAKE_BUILD_TYPE=Release
          cmake --build "$build"
          python3 tests/run_ctest.py "$build" Release "$RUNNER_TEMP/ctest-reports/clang-release" --require-x64
      - name: Run AddressSanitizer and UndefinedBehaviorSanitizer
        env:
          CC: clang-18
          CXX: clang++-18
          CFLAGS: -fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer
          LDFLAGS: -fsanitize=address,undefined
          ASAN_OPTIONS: halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          export CXXFLAGS="$CFLAGS"
          build="$RUNNER_TEMP/opentlv-sanitized"
          cmake -S . -B "$build" -G Ninja -DBUILD_TESTING=ON -DCMAKE_BUILD_TYPE=Debug
          cmake --build "$build"
          python3 tests/run_ctest.py "$build" Debug "$RUNNER_TEMP/ctest-reports/sanitizers" --require-x64
      - name: Publish CTest JUnit reports and logs
        if: ${{ !cancelled() && steps.ctest.outcome != 'skipped' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ctest-reports
          path: ${{ runner.temp }}/ctest-reports/
          if-no-files-found: error
      - name: Check and report reproducible library coverage
        id: coverage
        env:
          CC: gcc-13
          CXX: g++-13
          GCOV: gcov-13
        run: |
          test "$(gcc-13 -dumpfullversion)" = 13.3.0
          python3 -m unittest discover -s tests -p test_check_coverage.py
          python3 tests/check_coverage.py "$RUNNER_TEMP/coverage.txt"
          python3 tests/check_coverage.py "$RUNNER_TEMP/coverage-repeat.txt"
          diff -u "$RUNNER_TEMP/coverage.txt" "$RUNNER_TEMP/coverage-repeat.txt"
          {
            echo '### Fixed TLV coverage'
            echo
            echo '```text'
            cat "$RUNNER_TEMP/coverage.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Publish production coverage reports
        if: ${{ !cancelled() && steps.coverage.outcome != 'skipped' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-reports
          path: |
            ${{ runner.temp }}/coverage.txt
            ${{ runner.temp }}/coverage-repeat.txt
          if-no-files-found: error
      - name: Test symbol parsers with tool output fixtures
        run: python3 -m unittest discover -s tests -p test_check_symbols.py
      - name: Test Google Benchmark report validation
        run: python3 -m unittest discover -s benchmarks -p test_check_results.py
      - name: Test static CMake source and package consumers
        run: python3 tests/check_cmake_package.py --check-symbols
      - name: Test shared CMake source and package consumers
        run: python3 tests/check_cmake_package.py --shared --check-symbols
      - name: Build Fixed TLV fuzz targets
        env:
          CC: clang-18
          CXX: clang++-18
        run: |
          cmake -S tests/fuzz -B "$RUNNER_TEMP/fuzz-build" -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo
          cmake --build "$RUNNER_TEMP/fuzz-build"
      - name: Replay seeds and fuzz Fixed TLV contracts
        id: fuzz
        timeout-minutes: 3
        env:
          ASAN_OPTIONS: halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: python3 tests/fuzz/run.py "$RUNNER_TEMP/fuzz-build" "$RUNNER_TEMP/fuzz-failures"
      - name: Retain failing fuzz inputs
        if: ${{ failure() && steps.fuzz.outcome == 'failure' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fixed-tlv-fuzz-failures
          path: ${{ runner.temp }}/fuzz-failures/
          if-no-files-found: warn
      - name: Install Valgrind for Memcheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends valgrind=1:3.22.0-0ubuntu3
      - name: Check negative controls and GCC x64 Debug contracts with Memcheck
        id: memcheck
        env:
          CC: gcc-13
        run: python3 tests/run_memcheck.py "$RUNNER_TEMP/opentlv-tests/tests/Debug" "$RUNNER_TEMP/memcheck-reports"
      - name: Publish Memcheck reports
        if: ${{ !cancelled() && steps.memcheck.outcome != 'skipped' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fixed-tlv-memcheck
          path: ${{ runner.temp }}/memcheck-reports/
          if-no-files-found: error

  resource-usage:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        linkage: [static, shared]
    env:
      CC: gcc-13
      CXX: g++-13
      LINKAGE: ${{ matrix.linkage }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install GDB if needed
        run: |
          if ! command -v gdb >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends gdb
          fi
      - name: Check allocations and measure two clean Release builds
        run: |
          test "$("$CC" -dumpfullversion)" = 13.3.0
          test "$("$CXX" -dumpfullversion)" = 13.3.0
          build="$RUNNER_TEMP/resource-build"
          reports="$RUNNER_TEMP/resource-reports"
          mkdir -p "$reports"
          shared=OFF
          if [ "$LINKAGE" = shared ]; then shared=ON; fi
          flags="-O2 -DNDEBUG -march=x86-64 -mtune=generic"
          cmake -S . -B "$build" -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_FLAGS_RELEASE="$flags" -DCMAKE_CXX_FLAGS_RELEASE="$flags" \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DCMAKE_INTERPROCEDURAL_OPTIMIZATION=OFF \
            -DBUILD_SHARED_LIBS="$shared" -DOPENTLV_BUILD_ALLOCATION_CHECKS=ON \
            -DOPENTLV_BUILD_FOOTPRINT=ON -DOPENTLV_SIZE_TOOL=/usr/bin/size
          cmake --build "$build" --target opentlv_allocation_probe opentlv_footprint
          ctest --test-dir "$build" -C Release --no-tests=error --output-on-failure \
            --output-junit "$reports/checks.xml"
          footprint="$build/benchmarks/footprint/Release/footprint.json"
          cp "$footprint" "$reports/footprint.json"
          cmake --build "$build" --target opentlv_footprint --clean-first
          cp "$footprint" "$reports/footprint-repeat.json"
          cmp "$reports/footprint.json" "$reports/footprint-repeat.json"
      - name: Publish allocation checks, footprint and build settings
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fixed-tlv-resource-usage-${{ matrix.linkage }}
          path: |
            ${{ runner.temp }}/resource-reports/
            ${{ runner.temp }}/resource-build/benchmarks/Release/metadata.json
            ${{ runner.temp }}/resource-build/compile_commands.json
          if-no-files-found: error

  callgrind:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned Callgrind
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends valgrind=1:3.22.0-0ubuntu3
      - name: Test profile parsing and performance comparison
        id: checks
        run: |
          python3 -B -m unittest discover -s benchmarks -p test_run_callgrind.py
          python3 -B -m unittest discover -s benchmarks -p test_compare_performance.py
      - name: Collect candidate counts, footprint and timing
        id: candidate
        run: python3 -B benchmarks/collect_performance.py . "$RUNNER_TEMP/build-candidate" "$RUNNER_TEMP/performance-reports/candidate"
      - name: Collect evidence for the reviewed baseline
        if: ${{ !cancelled() && steps.checks.outcome == 'success' }}
        run: |
          baseline=$(cat benchmarks/performance-baseline.txt)
          [[ $baseline =~ ^[0-9a-f]{40}$ ]]
          git merge-base --is-ancestor "$baseline" "$GITHUB_SHA"
          git worktree add --detach "$RUNNER_TEMP/reference" "$baseline"
          python3 -B benchmarks/collect_performance.py "$RUNNER_TEMP/reference" "$RUNNER_TEMP/build-baseline" "$RUNNER_TEMP/performance-reports/baseline"
      - name: Compare revisions and publish summary
        if: ${{ !cancelled() }}
        run: |
          reports="$RUNNER_TEMP/performance-reports"
          status=0
          python3 -B tests/run_quality.py compare-performance --reports "$reports" \
            --output "$reports" --candidate-revision "$GITHUB_SHA" || status=$?
          cat "$reports/summary.md" >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
      - name: Publish Callgrind counts, raw profiles and build metadata
        if: ${{ !cancelled() && steps.candidate.outcome != 'skipped' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: callgrind-instruction-counts
          path: ${{ runner.temp }}/performance-reports/candidate/callgrind/
          if-no-files-found: error
      - name: Publish performance evidence for both revisions
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fixed-tlv-performance
          path: ${{ runner.temp }}/performance-reports/
          if-no-files-found: error

  windows-contracts:
    name: windows-${{ matrix.arch }}
    runs-on: windows-2022
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86
            platform: Win32
            config: Release
          - arch: x64
            platform: x64
            config: Debug
    env:
      TARGET_ARCH: ${{ matrix.arch }}
      TARGET_PLATFORM: ${{ matrix.platform }}
      BUILD_CONFIG: ${{ matrix.config }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Configure MSVC and GoogleTest
        run: >-
          cmake -S . -B build -G "Visual Studio 17 2022" -A $env:TARGET_PLATFORM -T "v143,version=14.44.35207"
          -DBUILD_TESTING=ON '-DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded$<$<CONFIG:Debug>:Debug>'
      - name: Build contract tests
        run: cmake --build build --config $env:BUILD_CONFIG --parallel
      - name: Run suites and verify ABI and native-size cases
        id: ctest
        run: python tests/run_ctest.py build $env:BUILD_CONFIG "$env:RUNNER_TEMP/ctest-reports" "--require-$env:TARGET_ARCH"
      - name: Compare repeated MSVC contracts
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
        run: |
          $reports = "$env:RUNNER_TEMP/ctest-reports"
          python -B tests/run_ctest.py build $env:BUILD_CONFIG "$reports/repeat" "--require-$env:TARGET_ARCH"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ((Get-FileHash "$reports/passed-cases.txt").Hash -ne (Get-FileHash "$reports/repeat/passed-cases.txt").Hash) {
            throw "The repeated MSVC contract runs passed different cases"
          }
      - name: Publish CTest results
        if: ${{ !cancelled() && steps.ctest.outcome != 'skipped' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ctest-reports-${{ matrix.arch }}
          path: ${{ runner.temp }}/ctest-reports/
          if-no-files-found: error

  windows-package:
    name: windows-package (${{ matrix.platform }})
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: windows-2022
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        platform: [Win32, x64]
    env:
      CMAKE_GENERATOR: Visual Studio 17 2022
      CMAKE_GENERATOR_PLATFORM: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Test static CMake source and package consumers with MSVC
        run: python tests/check_cmake_package.py --check-symbols
      - name: Test shared CMake source and package consumers with MSVC
        run: python tests/check_cmake_package.py --shared --check-symbols

  first-party-analysis:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install source quality tools and test headers
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends cppcheck=2.13.0-2ubuntu3 valgrind=1:3.22.0-0ubuntu3 gcc-13 g++-13
          python3 -m venv "$RUNNER_TEMP/source-quality"
          "$RUNNER_TEMP/source-quality/bin/python" -m pip install --require-hashes --only-binary=:all: -r .github/requirements-source-quality.txt
          echo "$RUNNER_TEMP/source-quality/bin" >> "$GITHUB_PATH"
      - name: Check first-party formatting, static analysis and negative controls
        run: python3 -B tests/run_quality.py analysis --work-dir "$RUNNER_TEMP"

  workflow-analyzers:
    name: workflow-analyzers
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Test quality gate decisions
        run: python3 -B -m unittest discover -s tests -p test_check_ci_gate.py
      - name: Check workflow syntax and expressions
        shell: bash
        run: |
          curl --fail --silent --show-error --location \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            --output "$RUNNER_TEMP/actionlint.tar.gz"
          printf '%s  %s\n' 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8 \
            "$RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -shellcheck= -pyflakes=
      - name: Install zizmor
        run: |
          python3 -m venv "$RUNNER_TEMP/zizmor-venv"
          "$RUNNER_TEMP/zizmor-venv/bin/python" -m pip install --require-hashes --only-binary=:all: -r .github/requirements-actions.txt
      - name: Audit workflow security offline
        if: github.ref != 'refs/heads/main' || (github.event_name != 'push' && github.event_name != 'schedule')
        run: |
          "$RUNNER_TEMP/zizmor-venv/bin/zizmor" --offline --strict-collection --collect=workflows .
      - name: Audit workflow security online
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'schedule')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          : "${GH_TOKEN:?GitHub token is required for online audits}"
          "$RUNNER_TEMP/zizmor-venv/bin/zizmor" --strict-collection --collect=workflows .

  quality-gate:
    name: fixed-tlv-quality
    if: ${{ always() }}
    needs: [fixed-tlv, resource-usage, callgrind, windows-contracts, windows-package, first-party-analysis, workflow-analyzers]
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Require the expected result from each job
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: python3 tests/check_ci_gate.py
